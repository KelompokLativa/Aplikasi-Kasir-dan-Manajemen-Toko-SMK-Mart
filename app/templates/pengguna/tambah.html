{% extends "base.html" %}

{% block title %}Tambah Pengguna - SMK Mart POS{% endblock %}

{% block content %}
<div class="p-6 md:p-8 max-w-2xl">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-text">Tambah Pengguna</h1>
        <p class="text-sm text-text-muted mt-1">Buat akun kasir atau administrator baru</p>
    </div>

    <div class="bg-surface rounded-2xl border border-border p-6 sm:p-8 shadow-sm">
        <form method="POST" action="{{ url_for('pengguna.tambah') }}" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="nama" class="block text-sm font-semibold text-text mb-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required
                    class="block w-full px-3.5 py-2.5 rounded-lg border border-border bg-surface text-text text-sm"
                    placeholder="Nama lengkap">
            </div>

            <div>
                <label for="username" class="block text-sm font-semibold text-text mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="block w-full px-3.5 py-2.5 rounded-lg border border-border bg-surface text-text text-sm"
                    placeholder="Username untuk login">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-text mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="block w-full px-3.5 py-2.5 rounded-lg border border-border bg-surface text-text text-sm"
                    placeholder="Password">
            </div>

            <div>
                <label for="peran" class="block text-sm font-semibold text-text mb-1">Peran</label>
                <select id="peran" name="peran"
                    class="block w-full px-3.5 py-2.5 rounded-lg border border-border bg-surface text-text text-sm">
                    <option value="kasir" selected>Kasir</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3 border-t border-border">
                <a href="{{ url_for('pengguna.index') }}"
                    class="px-5 py-2.5 rounded-lg border border-border text-sm font-semibold text-text">
                    Batal
                </a>
                <button type="submit"
                    class="px-5 py-2.5 rounded-lg bg-primary text-white text-sm font-semibold">
                    Simpan Pengguna
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
